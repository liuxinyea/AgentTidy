[package]
name = "agenttidy-desktop"
description = "AgentTidy desktop application (Tauri shell)"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "agenttidy-desktop"

[lib]
name = "agenttidy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
agenttidy-application = { workspace = true }
agenttidy-core = { workspace = true }
